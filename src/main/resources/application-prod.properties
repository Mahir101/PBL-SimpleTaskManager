# Production Profile Configuration

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Redis Configuration (Production)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=your_redis_password
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# JWT Configuration
jwt.secret=CHANGE_THIS_TO_A_STRONG_SECRET_KEY_IN_PRODUCTION
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Email Configuration (Production - Use real SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Configuration
app.base-url=https://your-domain.com
app.frontend-url=https://your-frontend-domain.com

# Security
logging.level.com.example.taskmanager=INFO
logging.level.org.springframework.security=WARN
